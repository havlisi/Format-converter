<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Format Converter</title>
<style>
  :root {
    --glass: rgba(255, 255, 255, 0.07);
    --glass-strong: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.16);
    --text: #f3f0ee;
    --subtext: rgba(243, 240, 238, 0.6);
    --accent-a: #ff8fb1;
    --accent-b: #b17bff;
    --done: #6ee7a8;
    --error: #ff8080;
    --skip: #ffcb7a;
    --busy: #8fc8ff;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", "SF Pro Display", -apple-system, sans-serif;
    color: var(--text);
    -webkit-user-select: none; user-select: none;
  }
  body {
    background:
      radial-gradient(60% 50% at 15% 8%, rgba(177, 123, 255, 0.35), transparent 60%),
      radial-gradient(55% 45% at 90% 12%, rgba(255, 143, 177, 0.30), transparent 60%),
      radial-gradient(70% 60% at 50% 100%, rgba(90, 60, 160, 0.35), transparent 65%),
      linear-gradient(160deg, #14101f 0%, #1a1428 45%, #100d1c 100%);
  }
  .blob {
    position: fixed; border-radius: 50%; filter: blur(70px);
    opacity: 0.55; pointer-events: none; z-index: 0;
  }
  .blob.b1 { width: 360px; height: 360px; top: -120px; left: -100px;
    background: radial-gradient(circle, var(--accent-b), transparent 70%); }
  .blob.b2 { width: 420px; height: 420px; bottom: -160px; right: -140px;
    background: radial-gradient(circle, var(--accent-a), transparent 70%); }

  .shell {
    position: relative; z-index: 1;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    padding: 28px 30px 22px;
  }

  .header { margin-bottom: 18px; }
  .header h1 {
    margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em;
  }
  .header p { margin: 4px 0 0; font-size: 12.5px; color: var(--subtext); }

  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  .btn {
    appearance: none; border: 1px solid var(--glass-border);
    background: var(--glass); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.08s ease;
  }
  .btn:hover { background: var(--glass-strong); border-color: rgba(255,255,255,0.3); }
  .btn:active { transform: scale(0.97); }
  .btn.danger-ish:hover { border-color: var(--error); }
  .spacer { flex: 1; }
  .count { font-size: 12px; color: var(--subtext); }

  .card {
    flex: 1; min-height: 0;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
    overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
  }

  .list { flex: 1; overflow-y: auto; padding: 8px; }
  .list::-webkit-scrollbar { width: 8px; }
  .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 8px; }

  .row {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 14px; margin: 4px 2px;
    border-radius: 14px;
    background: rgba(255,255,255,0.03);
    border: 1px solid transparent;
    transition: background 0.15s ease;
  }
  .row:hover { background: rgba(255,255,255,0.06); }
  .row.selected { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.08); }
  .row .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
    background: rgba(255,255,255,0.3);
  }
  .row.status-busy .dot { background: var(--busy); box-shadow: 0 0 8px var(--busy); animation: pulse 1.1s ease-in-out infinite; }
  .row.status-done .dot { background: var(--done); box-shadow: 0 0 8px var(--done); }
  .row.status-error .dot { background: var(--error); box-shadow: 0 0 8px var(--error); }
  .row.status-skipped .dot { background: var(--skip); box-shadow: 0 0 8px var(--skip); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .row .name { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .status { font-size: 11.5px; color: var(--subtext); flex: 0 0 auto; max-width: 40%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.status-done .status { color: var(--done); }
  .row.status-error .status { color: var(--error); }
  .row.status-skipped .status { color: var(--skip); }
  .row.status-busy .status { color: var(--busy); }

  .empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; pointer-events: none;
  }
  .empty .icon {
    width: 52px; height: 52px; border-radius: 16px;
    background: var(--glass-strong); border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center; font-size: 22px;
  }
  .empty p { margin: 0; font-size: 12.5px; color: var(--subtext); text-align: center; max-width: 220px; }

  .footer {
    display: flex; align-items: center; gap: 12px; margin-top: 16px;
  }
  .target-picker {
    display: flex; align-items: center; gap: 8px;
    background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 999px; padding: 6px 6px 6px 16px;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  }
  .target-picker span { font-size: 12.5px; color: var(--subtext); }
  .target-picker select {
    appearance: none; border: none; outline: none;
    background: rgba(255,255,255,0.1); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600;
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .target-picker select option { background: #241b36; color: var(--text); }

  .convert-btn {
    margin-left: auto;
    appearance: none; border: none; cursor: pointer;
    padding: 12px 26px; border-radius: 999px;
    font: inherit; font-size: 14px; font-weight: 650; color: #1c1424;
    background: linear-gradient(120deg, var(--accent-a), var(--accent-b));
    box-shadow: 0 8px 24px rgba(255, 130, 170, 0.35);
    transition: transform 0.08s ease, box-shadow 0.15s ease;
  }
  .convert-btn:hover { box-shadow: 0 10px 28px rgba(255, 130, 170, 0.5); }
  .convert-btn:active { transform: scale(0.97); }
  .convert-btn:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="shell">
    <div class="header">
      <h1>Format Converter</h1>
      <p>PDF, XLSX, DOCX, CSV — add files, pick a target, convert.</p>
    </div>

    <div class="toolbar">
      <button class="btn" onclick="addFiles()">Add Files…</button>
      <button class="btn" onclick="addFolder()">Add Folder…</button>
      <button class="btn danger-ish" onclick="clearList()">Clear</button>
      <div class="spacer"></div>
      <div class="count" id="count">No files queued</div>
    </div>

    <div class="card">
      <div class="list" id="list"></div>
      <div class="empty" id="empty">
        <div class="icon">📄</div>
        <p>Nothing queued yet — Add Files or Add Folder to get started</p>
      </div>
    </div>

    <div class="footer">
      <div class="target-picker">
        <span>Convert to</span>
        <select id="target"></select>
      </div>
      <button class="convert-btn" id="convertBtn" onclick="convertAll()">Convert All</button>
    </div>
  </div>

<script>
  let files = {};   // path -> {name, status}
  let order = [];   // path order

  function statusClass(status) {
    if (!status) return "";
    if (status.startsWith("done")) return "status-done";
    if (status.startsWith("error")) return "status-error";
    if (status.startsWith("skipped")) return "status-skipped";
    if (status.startsWith("converting")) return "status-busy";
    return "";
  }

  function render() {
    const list = document.getElementById("list");
    const empty = document.getElementById("empty");
    const count = document.getElementById("count");
    list.innerHTML = "";
    if (order.length === 0) {
      empty.style.display = "flex";
    } else {
      empty.style.display = "none";
      for (const path of order) {
        const f = files[path];
        const row = document.createElement("div");
        row.className = "row " + statusClass(f.status);
        row.innerHTML = `<div class="dot"></div><div class="name" title="${f.path}">${f.name}</div><div class="status">${f.status || "queued"}</div>`;
        list.appendChild(row);
      }
    }
    count.textContent = order.length === 0 ? "No files queued" : `${order.length} file${order.length !== 1 ? "s" : ""} queued`;
  }

  function addPaths(paths) {
    for (const p of paths) {
      if (files[p]) continue;
      files[p] = { path: p, name: p.split(/[\\/]/).pop(), status: "queued" };
      order.push(p);
    }
    render();
  }

  async function addFiles() {
    const paths = await pywebview.api.add_files();
    if (paths) addPaths(paths);
  }

  async function addFolder() {
    const paths = await pywebview.api.add_folder();
    if (paths) addPaths(paths);
  }

  function clearList() {
    files = {}; order = [];
    render();
  }

  async function loadTargets() {
    const targets = await pywebview.api.get_targets();
    const sel = document.getElementById("target");
    sel.innerHTML = targets.map(t => `<option value="${t}">${t.toUpperCase()}</option>`).join("");
  }

  function setStatus(path, status) {
    if (!files[path]) return;
    files[path].status = status;
    render();
  }
  // Exposed for Python to call back into during a running batch.
  window.setStatus = setStatus;

  async function convertAll() {
    if (order.length === 0) return;
    const target = document.getElementById("target").value;
    const paths = order.slice();

    const check = await pywebview.api.check_conflicts(paths, target);
    if (check.collision_error) {
      alert(check.collision_error);
      return;
    }
    if (check.overwrites.length) {
      const names = check.overwrites.map(p => p.split(/[\\/]/).pop()).join("\n");
      if (!confirm(`These files already exist and will be overwritten:\n${names}`)) return;
    }

    const btn = document.getElementById("convertBtn");
    btn.disabled = true;
    try {
      await pywebview.api.run_conversion(paths, target);
    } finally {
      btn.disabled = false;
    }
  }

  window.addEventListener("pywebviewready", async () => {
    await loadTargets();
    render();
  });
</script>
</body>
</html>
